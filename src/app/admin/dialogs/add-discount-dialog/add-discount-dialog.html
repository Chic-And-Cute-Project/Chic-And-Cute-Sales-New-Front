<div style="width: min(500px, 90vw);">
    <h2 mat-dialog-title>Nuevo Descuento</h2>
    <mat-dialog-content>
        <div class="tab-content">
            <mat-form-field appearance="outline" subscriptSizing="dynamic" style="height: fit-content">
                <mat-label>Nombre</mat-label>
                <input matInput [(ngModel)]="data.discount.name">
            </mat-form-field>
            <mat-form-field appearance="outline" subscriptSizing="dynamic">
                <mat-label>Descuento</mat-label>
                <input matInput type="number" [(ngModel)]="data.discount.quantity">
                <mat-hint>Colocar el valor sin el %</mat-hint>
            </mat-form-field>
            <mat-form-field appearance="outline" subscriptSizing="dynamic">
                <mat-label>Código del producto</mat-label>
                <input matInput [(ngModel)]="data.discount.productCode">
                <mat-hint>Opcional</mat-hint>
            </mat-form-field>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-button mat-dialog-close [disabled]="loading">Cancelar</button>
        <button matButton="filled" [disabled]="loading" (click)="onCreateDiscount()">
            <mat-icon>save</mat-icon>
            <span>Crear</span>
        </button>
        @if (loading) {
            <div style="margin-left: 8px">
                <mat-progress-spinner diameter="24" mode="indeterminate"></mat-progress-spinner>
            </div>
        }
    </mat-dialog-actions>
</div>
