<div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; gap: 16px">
    <h1 style="margin: 0">Stock</h1>
    <div style="overflow: auto; width: 90%; border: solid 1px; border-radius: 15px;">
        <table mat-table [dataSource]="users">
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Nombre </th>
                <td mat-cell *matCellDef="let user">{{user.name}}</td>
            </ng-container>

            <ng-container matColumnDef="lastName">
                <th mat-header-cell *matHeaderCellDef> Apellido </th>
                <td mat-cell  *matCellDef="let user">{{user.lastName}}</td>
            </ng-container>

            <ng-container matColumnDef="username">
                <th mat-header-cell *matHeaderCellDef> Usuario </th>
                <td mat-cell *matCellDef="let user">{{user.username}}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr style="cursor: pointer; height: 30px" mat-row *matRowDef="let user; columns: displayedColumns;" (click)="resetPassword(user)"></tr>
        </table>
    </div>
</div>
