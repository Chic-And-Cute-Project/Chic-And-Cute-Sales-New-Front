<div style="display: flex; flex-direction: column; height: 100%">
    <div style="flex: 1;"></div>
    <div style="display: flex; flex-direction: column; gap: 16px;">
        <h1 style="margin: 0; text-align: center;">Bienvenido</h1>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
            <button mat-flat-button [routerLink]="['/forgot-password']" style="background-color: #eae3db; color: #d1ae6f">Reseteo de contraseñas</button>
        </div>
    </div>
    <div style="flex: 1; display: flex; justify-content: end; align-items: end">
        <button matButton="filled" (click)="signOut()" style="background-color: #ff6464; margin: 0 15px 15px 0;">
            Cerrar Sesión
        </button>
    </div>
</div>
